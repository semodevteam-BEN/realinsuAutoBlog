<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealInsu Auto - SEO Blogger Poster</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 1.5rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            color: #555;
        }
        .btn {
            display: inline-block;
            background-color: #ff4b4b;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: background-color 0.3s;
            margin: 10px;
        }
        .btn:hover {
            background-color: #ff2b2b;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .note {
            font-size: 0.9rem;
            color: #888;
            margin-top: 2rem;
        }
        code {
            background-color: #f1f1f1;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 RealInsu Auto</h1>
        <p>
            이 프로젝트는 <strong>Streamlit</strong> 기반의 Python 애플리케이션입니다.<br>
            Netlify는 정적 사이트 호스팅 서비스이므로, 이 페이지가 보인다면<br>
            <strong>GitHub 연동은 성공</strong>했지만 앱은 실행되지 않은 상태입니다.
        </p>
        
        <div>
            <a href="https://share.streamlit.io/" target="_blank" class="btn">
                Streamlit Cloud에서 앱 실행하기
            </a>
        </div>
        
        <p style="margin-top: 30px; font-size: 1rem;">
            또는 로컬에서 아래 명령어로 실행할 수 있습니다:
        </p>
        <div>
            <code>streamlit run main.py</code>
        </div>
        
        <div class="note">
            <p><strong>Netlify 설정 팁:</strong><br>
            이 프로젝트를 온전히 웹에서 실행하려면 <a href="https://streamlit.io/cloud" target="_blank">Streamlit Cloud</a>와 같은<br>
            Python 런타임을 지원하는 서비스에 배포해야 합니다.</p>
        </div>
    </div>
</body>
</html>
